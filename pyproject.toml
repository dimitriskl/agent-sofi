[project]
name = "agent-sofi"
version = "0.0.1"
description = "A terminal coding assistant that runs agent pipelines defined as graphs."
readme = "README.md"
authors = [
    { name = "Dimitris Klis", email = "photdk@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
sofi = "sofi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sofi"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
